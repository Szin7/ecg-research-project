seed: 42

model:
  name: cnn1d
  in_channels: 1
  conv_channels: [16, 32, 64]
  kernel_sizes: [7, 5, 3]
  fc_hidden: 32
  dropout: 0.3

optim:
  name: adam
  lr: 0.0005
  weight_decay: 0.00001
  scheduler: plateau
  scheduler_patience: 4
  scheduler_factor: 0.5

train:
  batch_size: 128
  max_epochs: 50
  early_stopping_patience: 15
  early_stopping_metric: val_f1
  class_weighting: pos_weight
  oversample: false

checkpoint:
  dir: artifacts/models
  standard_name: baseline_cnn.pt
  defended_name: defended_cnn.pt
