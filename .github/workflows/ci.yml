name: Tests and container smoke check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cpu.lock
      - run: python -m pip install --require-hashes -r requirements-cpu.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m scripts.prepare_data --mode demo --task both
      - run: python -m pytest -q
      - run: python -m scripts.verify_study
  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: docker build -t ecg-research-project:test .
      - run: docker run -d --name ecg-research-project-test -p 127.0.0.1:8501:8501 ecg-research-project:test
      - name: Wait for application health
        shell: bash
        run: |
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs ecg-research-project-test
          exit 1
      - if: always()
        run: docker rm -f ecg-research-project-test || true
